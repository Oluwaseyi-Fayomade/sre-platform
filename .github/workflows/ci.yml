name: sre-platform CI

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 agents/ pipeline/ aws/ --max-line-length=100

  test:
    name: Test Agents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install psutil boto3

      - name: Test metric_collector
        run: python3 agents/metric_collector.py | python3 -m json.tool

      - name: Test log_collector
        run: python3 agents/log_collector.py | python3 -m json.tool

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform